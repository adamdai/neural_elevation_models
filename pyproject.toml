[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nemo"
version = "0.2.0"
description = "Neural elevation models for height-field fitting."
readme = "README.md"
authors = [{ name = "Adam Dai" }]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
tcnn = [
    "tinycudann",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nemo", "nemo.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
